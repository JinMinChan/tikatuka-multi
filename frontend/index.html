<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>티카투카 멀티</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="table">
        <header class="topbar">
          <article class="player-card player-card-left" id="player-card-0">
            <div class="turn-chip" id="turn-chip-0">TURN</div>
            <div class="avatar avatar-green"></div>
            <div>
              <strong id="player-name-0">FrangGabriel</strong>
              <small id="player-state-0">초록 진영</small>
            </div>
          </article>

          <article class="brand">
            <div class="dice-mark">🎲</div>
            <h1>티카투카 <span>TikaTuka</span></h1>
          </article>

          <article class="player-card player-card-right" id="player-card-1">
            <div class="turn-chip" id="turn-chip-1">TURN</div>
            <div class="avatar avatar-red"></div>
            <div>
              <strong id="player-name-1">레온하트 네리아</strong>
              <small id="player-state-1">빨강 진영</small>
            </div>
          </article>
        </header>

        <section class="lobby" id="lobby">
          <h2>멀티플레이 방</h2>
          <p>방을 만들면 4자리 번호가 생성됩니다. 상대가 이 번호로 입장하면 게임이 시작됩니다.</p>
          <div class="lobby-actions">
            <label class="nickname-row" for="nickname-input">
              <span>사용할 닉네임 :</span>
              <input id="nickname-input" maxlength="16" autocomplete="nickname" placeholder="닉네임 입력" />
            </label>
            <button id="create-room-button" type="button">방 만들기</button>
            <form id="join-form">
              <input id="room-code-input" inputmode="numeric" maxlength="4" placeholder="방 번호 4자리" />
              <button type="submit">입장</button>
            </form>
          </div>
          <p class="status" id="lobby-status"></p>
        </section>

        <section class="game-shell" id="game-shell" hidden>
          <section class="room-panel">
            <div>
              <span>방 번호</span>
              <strong id="room-code">----</strong>
            </div>
            <button id="copy-room-button" type="button">복사</button>
            <p id="connection-status">연결 중</p>
            <button class="leave-room-button" id="leave-button" type="button">나가기</button>
          </section>

          <section class="start-banner" id="start-banner" hidden aria-live="polite">
            <div class="rolloff-dice">
              <div>
                <small id="rolloff-name-0">초록</small>
                <div id="rolloff-die-0"></div>
              </div>
              <span class="versus">VS</span>
              <div>
                <small id="rolloff-name-1">빨강</small>
                <div id="rolloff-die-1"></div>
              </div>
            </div>
            <strong id="start-banner-text">선공!</strong>
          </section>

          <section class="board-wrap">
            <aside class="player-side side-left" aria-label="선공 주사위 영역">
              <div class="dice-tray tray-left">
                <div class="tray-label">선공 트레이</div>
                <div class="tray-dice" id="tray-0"></div>
              </div>
              <div class="tray-controls" id="tray-controls-0"></div>
            </aside>

            <section class="battle-board" id="battle-board" aria-label="티카투카 보드">
              <div class="field-row" data-field="0">
                <div class="field field-left" data-player="0" data-field="0" role="button" tabindex="0"></div>
                <div class="score-bridge" id="score-0">
                  <span class="score-left">0</span>
                  <span class="arrow">–</span>
                  <span class="score-right">0</span>
                </div>
                <div class="field field-right" data-player="1" data-field="0" role="button" tabindex="0"></div>
              </div>
              <div class="field-row" data-field="1">
                <div class="field field-left" data-player="0" data-field="1" role="button" tabindex="0"></div>
                <div class="score-bridge" id="score-1">
                  <span class="score-left">0</span>
                  <span class="arrow">–</span>
                  <span class="score-right">0</span>
                </div>
                <div class="field field-right" data-player="1" data-field="1" role="button" tabindex="0"></div>
              </div>
              <div class="field-row" data-field="2">
                <div class="field field-left" data-player="0" data-field="2" role="button" tabindex="0"></div>
                <div class="score-bridge" id="score-2">
                  <span class="score-left">0</span>
                  <span class="arrow">–</span>
                  <span class="score-right">0</span>
                </div>
                <div class="field field-right" data-player="1" data-field="2" role="button" tabindex="0"></div>
              </div>
              <div class="result-banner" id="result-banner" hidden>
                <strong id="result-winner-text">승리!</strong>
                <button type="button" id="restart-button">다시하기</button>
              </div>
            </section>

            <aside class="player-side side-right" aria-label="후공 주사위 영역">
              <div class="dice-tray tray-right">
                <div class="tray-label">후공 트레이</div>
                <div class="tray-dice" id="tray-1"></div>
              </div>
              <div class="tray-controls" id="tray-controls-1"></div>
            </aside>
          </section>
          <ol class="event-log" id="event-log"></ol>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
